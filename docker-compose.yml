services:
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: bingx-trading-bot:latest
    container_name: bingx-trading-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/logs
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
